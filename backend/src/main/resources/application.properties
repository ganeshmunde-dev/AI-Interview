# Application Name & Port
spring.application.name=interviewai-backend
server.port=8080
# Load local developer secrets (gitignored — place real API keys there)
spring.config.import=optional:classpath:application-local.properties

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/interviewai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
jwt.secret=InterviewAIPrivateSecretKeyForJWTAuthenticationSignature2026SecureKeyWithSufficientBitLength
jwt.expirationMs=86400000

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.interviewai.backend=INFO

# ── AI Configuration ──────────────────────────────────────────────────────────
# Gemini API key - set via environment variable: GEMINI_API_KEY
ai.gemini.api-key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
ai.gemini.api-url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent

# ── ElevenLabs Voice Configuration ───────────────────────────────────────────
# Set the real values via environment variables or in application-local.properties
# (which is gitignored — see .gitignore).
#
# ELEVENLABS_API_KEY  : your ElevenLabs secret key  (REQUIRED — never put real key here)
# ELEVENLABS_VOICE_ID : the voice ID from your ElevenLabs account
# ELEVENLABS_MODEL_ID : TTS model (default: eleven_multilingual_v2)
#
# If ELEVENLABS_API_KEY is not set, the voice endpoint returns 503 and the
# interview falls back to text mode gracefully.
elevenlabs.api-key=${ELEVENLABS_API_KEY:}
elevenlabs.voice-id=${ELEVENLABS_VOICE_ID:EXAVITQu4vr4xnSDxMaL}
elevenlabs.model-id=${ELEVENLABS_MODEL_ID:eleven_multilingual_v2}
elevenlabs.api-url=https://api.elevenlabs.io/v1/text-to-speech
